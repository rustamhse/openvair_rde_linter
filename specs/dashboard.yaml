meta:
  source: openvair/modules/dashboard
  maintainer_notes: Снимок символов с диска. Удалите лишнее и оставьте только публичный контракт модуля.
feature: dashboard
layers:
  adapters:
    required_classes:
    - name: AbstractRepository
      methods:
      - get_data
    - name: PrometheusRepository
      methods: []
  entrypoints:
    required_classes:
    - name: BandWithData
      methods: []
    - name: CpuData
      methods: []
    - name: DashboardCrud
      methods:
      - get_data
    - name: DiskInfo
      methods: []
    - name: IOLatency
      methods: []
    - name: IopsData
      methods: []
    - name: MemoryData
      methods: []
    - name: NodeInfo
      methods: []
    - name: StoragesData
      methods: []
    required_module_functions:
    - relative_path: entrypoints/api.py
      functions:
      - get_node_data
    required_http_endpoints:
    - method: GET
      path: /dashboard/
      handler: get_node_data
      parameters:
      - name: crud
        kind: depends
        required: true
        type_hint: DashboardCrud
  service_layer:
    required_classes:
    - name: DashboardServiceLayerManager
      methods:
      - get_data
    - name: PrometheusUnitOfWork
      methods: []
