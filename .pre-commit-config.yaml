repos:
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (staged Python files)
        exclude: ^(experiment/|requirements_linter/)
        additional_dependencies:
          - types-PyYAML==6.0.12.20240917
          - types-requests==2.32.0.20240914
          - types-aiofiles==24.1.0.20240626
          - types-toml==0.10.8.20240310
          - pika-stubs==0.1.3
        args: [--config-file=mypy.ini]
  - repo: local
    hooks:
      - id: ruff-hook
        name: Custom ruff hook
        entry: bash .githooks/ruff
        language: system
        types: [python]
        exclude: ^(experiment/|requirements_linter/)
